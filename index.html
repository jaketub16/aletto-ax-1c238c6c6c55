<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex"><meta name="googlebot" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Private</title><link rel="icon" href="data:,">
<style>
:root{--bg:#05070d;--p1:#0b0e16;--p2:#10141f;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--tx:#f4f5f8;--mut:#8b93a5;--dim:#5d6576;--red:#ff3b3b;--grn:#34d399;--amb:#fbbf24;--blu:#60a5fa;--vio:#a78bfa}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(60% 40% at 10% -10%,rgba(56,94,255,.10),transparent 70%),radial-gradient(40% 30% at 100% 0,rgba(255,59,59,.06),transparent 70%)}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
/* gate */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
#gate form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px}
#gate img{height:22px;align-self:flex-start;margin-bottom:18px;opacity:.95}
#gate h1{font-size:22px;letter-spacing:-.02em;font-weight:650}
#gate p{color:var(--mut);font-size:13px}
#gate input{background:var(--p1);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;outline:none}
#gate input:focus{border-color:rgba(96,165,250,.6)}
#gate button{background:#fff;color:#000;border:0;border-radius:12px;padding:12px;font-weight:600;cursor:pointer}
#gate .err{color:var(--red);font-size:12.5px;min-height:18px}
/* app */
#app{display:none;max-width:1440px;margin:0 auto;padding:22px 28px 60px;position:relative}
header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:20px}
header img{height:18px}
header .t{font-weight:650;letter-spacing:-.01em;font-size:15px}
header .t span{color:var(--red)}
header .upd{color:var(--dim);font-size:12px;margin-left:auto}
.tabs{display:flex;gap:4px;background:var(--p1);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button,.seg button{background:none;border:0;padding:6px 12px;border-radius:7px;cursor:pointer;color:var(--mut);font-size:13px;white-space:nowrap}
.tabs button.on,.seg button.on{background:var(--p2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line2)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.seg{display:flex;gap:2px;background:var(--p1);border:1px solid var(--line);border-radius:10px;padding:3px;overflow-x:auto}
.ctl{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:12.5px}
.ctl select,.ctl input[type=date]{background:var(--p1);border:1px solid var(--line);border-radius:8px;padding:6px 8px;color-scheme:dark}
.sw{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
.sw i{width:28px;height:16px;border-radius:9px;background:#2a3040;position:relative;transition:.2s}
.sw i:after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:#cfd5e2;top:2px;left:2px;transition:.2s}
.sw.on i{background:var(--amb)}.sw.on i:after{left:14px;background:#111}
.range{color:var(--mut);font-size:12.5px;margin-left:auto}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:18px}
.kpi{background:var(--p1);padding:16px 18px;min-width:0}
.kpi .l{color:var(--mut);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase}
.kpi .v{font-size:26px;font-weight:650;letter-spacing:-.03em;margin-top:6px;white-space:nowrap}
.kpi .s{color:var(--dim);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.good{color:var(--grn)!important}.bad{color:var(--red)!important}.warn{color:var(--amb)!important}
.grid2{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;margin-bottom:18px}
.panel{background:var(--p1);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0}
.panel h3{font-size:12px;font-weight:600;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.panel h3 .leg{margin-left:auto;display:flex;gap:12px;text-transform:none;letter-spacing:0;font-weight:500;font-size:11.5px}
.leg b{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.mix{display:flex;flex-direction:column;gap:12px}
.mix .r{display:grid;grid-template-columns:92px 1fr 54px;align-items:center;gap:10px;font-size:12.5px}
.mix .r .n{color:var(--mut)}
.mix .track{display:flex;height:22px;border-radius:6px;overflow:hidden;background:#151a26}
.mix .track div{height:100%;transition:width .5s}
.mix .tot{text-align:right;color:var(--mut)}
.mixleg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:12px;color:var(--mut)}
.mixleg span{cursor:default}
svg text{fill:var(--dim);font-size:10.5px}
#tip{position:fixed;pointer-events:none;background:#161b28;border:1px solid var(--line2);border-radius:10px;padding:8px 10px;font-size:12px;display:none;z-index:9;white-space:nowrap}
/* table */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--p1)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:9px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:var(--p1);color:var(--mut);font-weight:600;font-size:11px;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;user-select:none}
th:hover{color:var(--tx)}th.sorted{color:var(--tx)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--p1);z-index:1;min-width:260px;max-width:340px}
tbody tr:hover td{background:#0f131d}
td:first-child{overflow:hidden;text-overflow:ellipsis}
tr.l0 td{font-weight:600}tr.l0 td:first-child{font-size:13px}
tr.l1 td:first-child{padding-left:30px}tr.l2 td:first-child{padding-left:50px}tr.l3 td:first-child{padding-left:70px;color:#cfd5e2}
tr.l1 td,tr.l2 td,tr.l3 td{color:#d3d8e3}
.car{display:inline-block;width:14px;color:var(--dim);transition:transform .15s}
tr.open>td:first-child .car{transform:rotate(90deg)}
tr.has{cursor:pointer}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:0}
td .z{color:var(--dim)}
.pill{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:99px;border:1px solid var(--line2);color:var(--mut)}
.pill.active{color:var(--grn);border-color:rgba(52,211,153,.35)}.pill.paused{color:var(--dim)}
.tag{display:inline-block;font-size:10px;padding:0 6px;border-radius:99px;margin-left:6px;vertical-align:1px;border:1px solid}
.tag.est{color:var(--amb);border-color:rgba(251,191,36,.4)}.tag.part{color:var(--vio);border-color:rgba(167,139,250,.45)}
.notes{margin-top:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.notes h4{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.notes li{color:#aab2c3;font-size:12.5px;margin:0 0 6px 16px}
.notes b{color:var(--tx);font-weight:600}
/* weekly */
.wk{background:var(--p1);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.wk .h{display:grid;grid-template-columns:24px 220px 1fr auto;gap:14px;align-items:center;padding:16px 18px;cursor:pointer}
.wk .h:hover{background:#0f131d}
.wk .h .lab{font-weight:600}.wk .h .lab small{display:block;color:var(--dim);font-weight:400;font-size:11.5px}
.wk .h .hl{display:flex;gap:22px;flex-wrap:wrap;color:var(--mut);font-size:12.5px}
.wk .h .hl b{color:var(--tx);font-weight:600;margin-right:4px}
.wk .h .cnt{display:flex;gap:6px}
.wk .b{display:none;border-top:1px solid var(--line);padding:16px 18px 20px}
.wk.open .b{display:block}.wk.open .car{transform:rotate(90deg)}
.wk .cols{display:grid;grid-template-columns:1.2fr 1fr;gap:22px}
.wk h5{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:4px 0 10px}
.rec{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.rec .meta{color:var(--dim);font-size:11.5px;margin-top:3px}
.st{font-size:10.5px;padding:2px 8px;border-radius:99px;border:1px solid;height:fit-content;min-width:64px;text-align:center}
.st.Open{color:var(--blu);border-color:rgba(96,165,250,.4)}.st.Done{color:var(--grn);border-color:rgba(52,211,153,.4)}.st.Declined{color:var(--dim);border-color:var(--line2)}
.chg{padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.chg .w{color:var(--dim);font-size:11.5px}.chg .ba{color:var(--mut);font-size:12px;margin-top:3px}
.wkt{width:100%;font-size:12px;margin-bottom:14px}.wkt td,.wkt th{padding:6px 8px}.wkt th:first-child,.wkt td:first-child{position:static;min-width:120px}
.empty{color:var(--dim);font-size:12.5px;padding:8px 0}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.grid2,.notes,.wk .cols{grid-template-columns:1fr}}
@media (max-width:640px){.kpi .s{white-space:normal}#app{padding:14px 12px 40px}.kpis{grid-template-columns:repeat(2,1fr)}.kpi .v{font-size:21px}.range{margin-left:0;width:100%}.wk .h{grid-template-columns:20px 1fr}.wk .h .hl,.wk .h .cnt{grid-column:2}header .upd{width:100%;margin-left:0}}
</style></head>
<body>
<div id="gate"><form id="gf" autocomplete="off">
  <img src="logo.png" alt="">
  <h1>Private dashboard</h1>
  <p>Enter the team passphrase. Data is decrypted in this browser only.</p>
  <input id="pw" type="password" placeholder="Passphrase" autofocus>
  <label class="ctl"><input type="checkbox" id="rem"> Keep unlocked in this tab</label>
  <button id="ub">Unlock</button><div class="err" id="err"></div>
</form></div>

<div id="app">
<header>
  <img src="logo.png" alt=""><div class="t">Attribution<span>.</span></div>
  <div class="tabs" id="tabs"><button data-v="funnel" class="on">Funnel</button><button data-v="weekly">Weekly</button></div>
  <div class="upd" id="upd"></div>
</header>

<section id="v-funnel">
<div class="bar">
  <div class="seg" id="rng"><button data-r="7">7d</button><button data-r="14" class="on">14d</button><button data-r="30">30d</button><button data-r="60">60d</button><button data-r="5k">Last $5k</button><button data-r="c">Custom</button></div>
  <span class="ctl" id="cust" style="display:none"><input type="date" id="d0"> → <input type="date" id="d1"></span>
  <div class="seg" id="chs"><button data-c="all" class="on">All</button><button data-c="li">LinkedIn</button><button data-c="meta">Meta</button><button data-c="org">Organic &amp; other</button></div>
  <label class="ctl">Model <select id="model"><option value="rule">Aletto rule (paid touch wins)</option><option value="first">First touch</option><option value="last">Last touch</option></select></label>
  <span class="sw ctl" id="estsw" title="Spread untracked LinkedIn post-text leads across prospecting ads by impression share (estimate)"><i></i>Spread post-text (est.)</span>
  <span class="sw ctl" id="detsw"><i></i>All columns</span>
  <span class="range num" id="rtxt"></span>
</div>
<div class="kpis" id="kpis"></div>
<div class="grid2">
  <div class="panel"><h3>Daily trend<span class="leg"><span><b style="background:#2b3a5c"></b>Spend</span><span><b style="background:var(--blu)"></b>Leads</span><span><b style="background:var(--red)"></b>Strats</span><span><b style="background:var(--grn)"></b>Scopes</span></span></h3><div id="trend"></div></div>
  <div class="panel"><h3>Channel mix</h3><div class="mix" id="mix"></div><div class="mixleg" id="mixleg"></div></div>
</div>
<div class="tw"><table id="tbl"><thead></thead><tbody></tbody></table></div>
<div class="notes" id="notes"></div>
</section>

<section id="v-weekly" style="display:none">
<div class="bar"><div class="seg" id="wf"><button data-s="all" class="on">All recs</button><button data-s="Open">Open</button><button data-s="Done">Done</button><button data-s="Declined">Declined</button></div>
<span class="range">Weeks run Fri–Thu ET. Numbers are frozen snapshots taken when each week was saved.</span></div>
<div id="weeks"></div>
</section>
</div>
<div id="tip"></div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let ENC=null,P=null;
async function derive(pass,salt,iter){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},true,['decrypt'])}
async function open(key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv),additionalData:new TextEncoder().encode(ENC.aad)},key,b64(ENC.ct));
 const ds=new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'));return JSON.parse(await new Response(ds).text())}
async function boot(){ENC=await (await fetch('data.enc',{cache:'no-store'})).json();
 const sk=sessionStorage.getItem('axk');
 if(sk){try{const key=await crypto.subtle.importKey('raw',b64(sk),'AES-GCM',true,['decrypt']);P=await open(key);start();return}catch(e){sessionStorage.removeItem('axk')}}}
$('#gf').onsubmit=async e=>{e.preventDefault();$('#err').textContent='';$('#ub').textContent='Unlocking…';
 try{if(!ENC)await boot();const key=await derive($('#pw').value,b64(ENC.salt),ENC.iter);P=await open(key);
  if($('#rem').checked){const raw=new Uint8Array(await crypto.subtle.exportKey('raw',key));sessionStorage.setItem('axk',btoa(String.fromCharCode(...raw)))}
  $('#pw').value='';start()}catch(err){$('#err').textContent='Wrong passphrase.';$('#ub').textContent='Unlock'}};
boot();

// ---------------- state ----------------
const S={r:'14',c:'all',model:'rule',est:false,det:false,sort:'spend',dir:-1,open:new Set(),wf:'all',wopen:new Set()};
const CC={'LinkedIn Ads':'#60a5fa','Meta Ads':'#a78bfa','Google Ads':'#fbbf24','Organic social':'#34d399','Organic search':'#2dd4bf','AI assistants':'#f472b6','Email & SMS':'#fb923c','Referral':'#94a3b8','Direct / unknown':'#4b5563'};
const fmt$=v=>v==null||!isFinite(v)?'–':Math.abs(v)<0.005?'$0':'$'+(Math.abs(v)>=10000?Math.round(v).toLocaleString('en-US'):Math.abs(v)>=100?Math.round(v).toLocaleString('en-US'):v.toFixed(2));
const fmtN=(v,d=0)=>v==null||!isFinite(v)?'–':(Math.abs(v-Math.round(v))<1e-9?Math.round(v).toLocaleString('en-US'):v.toLocaleString('en-US',{maximumFractionDigits:d||1,minimumFractionDigits:0}));
const pct=v=>v==null||!isFinite(v)?'–':(v*100).toFixed(v<.1?2:1)+'%';
const div=(a,b)=>b?a/b:null;
function chOk(ch){if(S.c=='all')return true;if(S.c=='li')return ch=='LinkedIn Ads';if(S.c=='meta')return ch=='Meta Ads';return !P.meta.paid.includes(ch)}
function rangeIdx(){const n=P.days.length;let a=0,b=n-2; // default: up to yesterday (today is partial)
 if(S.r=='c'){a=Math.max(0,P.days.indexOf($('#d0').value));b=P.days.indexOf($('#d1').value);if(b<0)b=n-1;if(a<0)a=0}
 else if(S.r=='5k'){let s=0;a=b;const sp=new Array(n).fill(0);for(const r of P.ad)if(chOk(P.ents[r[1]][0]))sp[r[0]]+=r[2];for(let i=b;i>=0;i--){s+=sp[i];a=i;if(s>=5000)break}}
 else{a=Math.max(0,b-(+S.r)+1)}return [a,b]}
const F=['spend','impr','clicks','leads','qleads','strats','cxl','asked','scopes','sales','rev','cash'];
function agg(){const [a,b]=rangeIdx();const E={},Dy={};const z=()=>Object.fromEntries(F.map(f=>[f,0]));
 const put=(i,d,arr,off)=>{const ch=P.ents[i][0];if(!chOk(ch))return;const o=E[i]||(E[i]=z()),y=Dy[d]||(Dy[d]=z());arr.forEach((v,j)=>{const f=F[off+j];o[f]+=v;y[f]+=v})};
 for(const r of P.ad)if(r[0]>=a&&r[0]<=b)put(r[1],r[0],r.slice(2),0);
 for(const r of P.ghl[S.model])if(r[0]>=a&&r[0]<=b)put(r[1],r[0],r.slice(2),3);
 if(S.est)for(const r of P.pt[S.model])if(r[0]>=a&&r[0]<=b)put(r[1],r[0],r.slice(2),3);
 const G={};for(const r of P.ga)if(r[0]>=a&&r[0]<=b){const ch=P.meta.channels[r[1]];if(!chOk(ch))continue;const g=G[ch]||(G[ch]={saas:0,liref:0,vsl:0,conf:0});g.saas+=r[2];g.liref+=r[3];g.vsl+=r[4];g.conf+=r[5]}
 let nl=0;for(const r of P.nonlead)if(r[0]>=a&&r[0]<=b)nl+=r[1];
 return {a,b,E,Dy,G,nl}}
function derive2(o){o.ctr=div(o.clicks,o.impr);o.cpc=div(o.spend,o.clicks);o.cpl=o.spend?div(o.spend,o.leads):null;o.cps=o.spend?div(o.spend,o.strats):null;o.cpa=o.spend?div(o.spend,o.asked):null;o.cpsc=o.spend?div(o.spend,o.scopes):null;o.cpsale=o.spend?div(o.spend,o.sales):null;o.roas=o.spend?o.cash/o.spend:null;return o}

// ---------------- render ----------------
function start(){$('#gate').style.display='none';$('#app').style.display='block';
 const g=new Date(P.meta.generated);$('#upd').textContent='Updated '+g.toLocaleString('en-GB',{timeZone:'Europe/Madrid',weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+' Madrid';
 $('#d0').value=P.days[Math.max(0,P.days.length-15)];$('#d1').value=P.days[P.days.length-2];$('#d0').min=$('#d1').min=P.days[0];$('#d0').max=$('#d1').max=P.days.at(-1);
 $$('#rng button').forEach(x=>x.onclick=()=>{S.r=x.dataset.r;$$('#rng button').forEach(y=>y.classList.toggle('on',y==x));$('#cust').style.display=S.r=='c'?'flex':'none';render()});
 $$('#chs button').forEach(x=>x.onclick=()=>{S.c=x.dataset.c;$$('#chs button').forEach(y=>y.classList.toggle('on',y==x));render()});
 $('#d0').onchange=$('#d1').onchange=render;$('#model').onchange=e=>{S.model=e.target.value;render()};
 $('#estsw').onclick=()=>{S.est=!S.est;$('#estsw').classList.toggle('on',S.est);render()};
 $('#detsw').onclick=()=>{S.det=!S.det;$('#detsw').classList.toggle('on',S.det);render()};
 $$('#tabs button').forEach(x=>x.onclick=()=>{$$('#tabs button').forEach(y=>y.classList.toggle('on',y==x));$('#v-funnel').style.display=x.dataset.v=='funnel'?'':'none';$('#v-weekly').style.display=x.dataset.v=='weekly'?'':'none'});
 $$('#wf button').forEach(x=>x.onclick=()=>{S.wf=x.dataset.s;$$('#wf button').forEach(y=>y.classList.toggle('on',y==x));weekly()});
 render();weekly()}
function render(){const A=agg();const T=derive2(Object.fromEntries(F.map(f=>[f,0])));
 for(const o of Object.values(A.E))F.forEach(f=>T[f]+=o[f]);derive2(T);
 const dd=s=>new Date(s+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
 $('#rtxt').textContent=`${dd(P.days[A.a])} – ${dd(P.days[A.b])} ET · ${A.b-A.a+1} days`+(A.b==P.days.length-1?' (today partial)':'');
 kpis(T,A);trend(A);mix(A);table(A);notes(A)}
function kpis(T,A){const tgt=P.meta.target_scope;const g=Object.values(A.G).reduce((s,x)=>(s.vsl+=x.vsl,s.conf+=x.conf,s),{vsl:0,conf:0});
 const k=[['Spend',fmt$(T.spend),'ad platforms only'],['Leads',fmtN(T.leads),`${fmtN(T.qleads)} qualified · ${fmt$(T.cpl)} / lead`],
 ['Strats',fmtN(T.strats),`${fmtN(T.cxl)} cancelled · ${fmt$(T.cps)} / Strat`],['Scopes',`${fmtN(T.scopes)}`,`${fmtN(T.asked)} asked · ${fmt$(T.cpa)} / asked`],
 ['$ / Scope booked',fmt$(T.cpsc),`target $${tgt}`,T.cpsc==null?'':T.cpsc<=tgt?'good':'bad'],['Sales',fmtN(T.sales),`${fmt$(T.cash)} cash · ROAS ${T.roas==null?'–':T.roas.toFixed(2)+'×'}`]];
 $('#kpis').innerHTML=k.map(([l,v,s,c])=>`<div class="kpi"><div class="l">${l}</div><div class="v num ${c||''}">${v}</div><div class="s num">${s}</div></div>`).join('')}
function trend(A){const W=Math.max(320,$('#trend').clientWidth||600),H=200,pl=34,pr=30,pt=8,pb=22;const n=A.b-A.a+1;
 const rows=[...Array(n)].map((_,i)=>A.Dy[A.a+i]||{spend:0,leads:0,strats:0,scopes:0});
 const ms=Math.max(1,...rows.map(r=>r.spend)),mc=Math.max(1,...rows.map(r=>r.leads));const bw=(W-pl-pr)/n;
 const x=i=>pl+i*bw+bw/2,ys=v=>H-pb-(H-pt-pb)*v/ms,yc=v=>H-pb-(H-pt-pb)*v/mc;
 const line=(f,c)=>`<polyline fill="none" stroke="${c}" stroke-width="1.8" stroke-linejoin="round" points="${rows.map((r,i)=>x(i)+','+yc(r[f])).join(' ')}"/>`;
 let s=`<svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="display:block">`;
 for(let t=0;t<=2;t++){const v=ms*t/2;s+=`<line x1="${pl}" x2="${W-pr}" y1="${ys(v)}" y2="${ys(v)}" stroke="rgba(255,255,255,.05)"/><text x="${pl-6}" y="${ys(v)+3}" text-anchor="end">$${Math.round(v)}</text><text x="${W-pr+6}" y="${yc(mc*t/2)+3}">${Math.round(mc*t/2)}</text>`}
 rows.forEach((r,i)=>{s+=`<rect x="${x(i)-bw*.36}" y="${ys(r.spend)}" width="${bw*.72}" height="${H-pb-ys(r.spend)}" rx="2" fill="#2b3a5c"/>`});
 s+=line('leads','#60a5fa')+line('strats','#ff3b3b')+line('scopes','#34d399');
 const step=Math.ceil(n/8);rows.forEach((r,i)=>{if(i%step==0)s+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${P.days[A.a+i].slice(5).replace('-','/')}</text>`});
 rows.forEach((r,i)=>{s+=`<rect class="hz" data-i="${i}" x="${x(i)-bw/2}" y="0" width="${bw}" height="${H}" fill="transparent"/>`});
 $('#trend').innerHTML=s+'</svg>';
 $$('#trend .hz').forEach(el=>{el.onmousemove=e=>{const r=rows[+el.dataset.i];tip(e,`<b>${P.days[A.a+ +el.dataset.i]}</b><br>Spend ${fmt$(r.spend)} · Leads ${fmtN(r.leads)}<br>Strats ${fmtN(r.strats)} · Scopes ${fmtN(r.scopes)}`)};el.onmouseleave=()=>$('#tip').style.display='none'})}

 $$('#mix .track div').forEach(el=>{el.onmousemove=e=>tip(e,el.dataset.t);el.onmouseleave=()=>$('#tip').style.display='none'})}

const COLS=[['spend','Spend',fmt$,0],['impr','Impr',v=>fmtN(v),1],['ctr','CTR',pct,1],['cpc','CPC',fmt$,1],['leads','Leads',v=>fmtN(v),0],['cpl','$/Lead',fmt$,0],['qleads','Q leads',v=>fmtN(v),1],
 ['strats','Strats',v=>fmtN(v),0],['cxl','Cxl',v=>fmtN(v),1],['cps','$/Strat',fmt$,0],['asked','Sc. asked',v=>fmtN(v),0],['scopes','Sc. booked',v=>fmtN(v),0],['cpsc','$/Scope',fmt$,0],

function tree(A){const root={};const z=()=>Object.fromEntries(F.map(f=>[f,0]));
 for(const [i,o] of Object.entries(A.E)){const [ch,camp,adset,ad,st,bud]=P.ents[i];
  const path=[ch,camp,adset,ad].filter((x,j)=>j<3||x);let lvl=root,nodes=[];
  path.forEach((k,j)=>{lvl[k]=lvl[k]||{name:k,lvl:j,kids:{},m:z(),st:'',bud:null,ent:[]};const n=lvl[k];F.forEach(f=>n.m[f]+=o[f]);nodes.push(n);lvl=n.kids});
  const last=nodes.at(-1);last.ent.push(+i)}
 // statuses
 P.ents.forEach(([ch,camp,adset,ad,st,bud])=>{const c=root[ch]?.kids[camp];const s=c?.kids[adset];if(!s)return;if(!ad){if(st)s.st=st;if(bud)s.bud=bud}else if(s.kids[ad]&&st)s.kids[ad].st=st});
 const fin=n=>{const ks=Object.values(n.kids);ks.forEach(fin);if(n.lvl==1)n.st=ks.some(k=>k.st=='active')?'active':(ks.some(k=>k.st)?'paused':'');
  if(n.lvl==2&&ks.length){const own=derive2({...n.m});ks.forEach(k=>F.forEach(f=>own[f]-=k.m[f]));if(F.some(f=>Math.abs(own[f])>0.01&&f!='impr'))n.kids['(ad not in UTM)']={name:'(ad not in UTM)',lvl:3,kids:{},m:own,st:'',bud:null,ent:[]}}
  derive2(n.m)};
 Object.values(root).forEach(fin);
 Object.entries(root).forEach(([ch,n])=>{const g=A.G[ch];if(g){n.m.vsl=g.vsl;n.m.v2b=div(g.conf,g.vsl)}});return root}
function table(A){const R=tree(A);const cols=COLS.filter(c=>S.det||!c[3]);

 $('#tbl thead').innerHTML=th;$$('#tbl th').forEach(h=>h.onclick=()=>{const k=h.dataset.k;if(k=='status')return;S.dir=S.sort==k?-S.dir:-1;S.sort=k;render()});
 const sv=n=>S.sort=='name'?n.name:(n.m[S.sort]??-1e12);

 let h='';const walk=(n,id)=>{const ks=srt(Object.values(n.kids));const op=S.open.has(id);const has=ks.length>0;
  const nm=n.lvl==0?`<span class="dot" style="background:${CC[n.name]||'#666'}"></span>${n.name}`:esc(n.name||'(none)');
  let tags='';if(/Post-text|unattributed/.test(n.name))tags+='<span class="tag est">untracked</span>';if(/Old Meta account/.test(n.name))tags+='<span class="tag part">spend not visible</span>';if(n.lvl==0&&n.name=='Meta Ads')tags+='<span class="tag part">spend partial</span>';
  h+=`<tr class="l${n.lvl} ${has?'has':''} ${op?'open':''}" data-id="${esc(id)}"><td title="${esc(n.name)}"><span class="car">${has?'›':''}</span>${nm}${tags}</td>`+cols.map(c=>{
   if(c[0]=='status'){return `<td>${n.st?`<span class="pill ${n.st}">${n.st}${n.bud?` · $${n.bud}/d`:''}</span>`:''}</td>`}
   const v=n.m[c[0]];const isEst=S.est&&n.lvl>0&&id.startsWith('LinkedIn Ads')&&['leads','cpl','qleads','strats','cps','asked','scopes','cpsc','cxl','sales','cash','roas','cpsale','rev'].includes(c[0]);
   const txt=(v==null||Math.abs(v)<0.005)?`<span class="z">${v===0?'0':'–'}</span>`:c[2](v);
   const cls=c[0]=='cpsc'&&v!=null?(v<=P.meta.target_scope?'good':'bad'):'';
   return `<td class="num ${cls}">${txt}${isEst&&n.lvl>0&&v?'<sup style="color:var(--amb)">e</sup>':''}</td>`}).join('')+'</tr>';
  if(op)ks.forEach(k=>walk(k,id+'›'+k.name))};
 srt(Object.values(R)).forEach(n=>walk(n,n.name));$('#tbl tbody').innerHTML=h;
 $$('#tbl tr.has').forEach(tr=>tr.onclick=()=>{const id=tr.dataset.id;S.open.has(id)?S.open.delete(id):S.open.add(id);render()})}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function notes(A){const g=A.G['LinkedIn Ads'];const m=P.meta;
 $('#notes').innerHTML=`<div><h4>Exact</h4><ul>
